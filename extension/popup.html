<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Posting Trust Check</title>
<style>
  :root {
    --ink: #1c2430; --muted: #5b6676; --line: #d5dbe4; --bg: #ffffff; --panel: #f3f5f8;
    --green: #1b7f4b; --yellow: #a86a00; --red: #b3261e; --accent: #1f4e8c;
  }
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  h1 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input, textarea { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: inherit; background: #fff; }
  textarea { height: 90px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--accent); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: .6; cursor: default; }
  #result { margin-top: 12px; display: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #banner { padding: 10px 12px; color: #fff; display: flex; align-items: baseline; gap: 10px; }
  #score { font-size: 28px; font-weight: 700; }
  #verdict { font-size: 14px; }
  #detail { padding: 10px 12px; background: var(--panel); }
  #detail ul { margin: 0; padding-left: 18px; }
  #detail li { margin: 3px 0; }
  #msg { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .Green { background: var(--green); } .Yellow { background: var(--yellow); } .Red { background: var(--red); }
</style>
</head>
<body>
  <h1>Check this job posting</h1>
  <label for="company">Company name</label>
  <input id="company" type="text">
  <label for="website">Company website</label>
  <input id="website" type="text" placeholder="company.com">
  <label for="email">Recruiter email</label>
  <input id="email" type="text">
  <label for="text">Job title and description</label>
  <textarea id="text"></textarea>

  <div class="row">
    <button id="grab" class="secondary">Use selected text</button>
    <button id="check" class="primary">Check posting</button>
    <button id="clear" class="secondary">Clear</button>
  </div>

  <div id="result">
    <div id="banner"><span id="score"></span><span id="verdict"></span></div>
    <div id="detail">
      <ul id="reasons"></ul>
      <div class="row"><button id="report" class="secondary">Report this posting</button></div>
    </div>
  </div>
  <div id="msg" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
